[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "openline-self-healing-foundation-private"
version = "0.0.1.dev0"
description = "Private research: conditional Git and SQLite admission with agent handoff"
requires-python = ">=3.11"
dependencies = ["cryptography>=38,<51"]
license = "Apache-2.0"
[tool.setuptools.packages.find]
include = ["foundation*"]
