# OpenLine Production Isolation — systemd-tmpfiles configuration
# Install to: /etc/tmpfiles.d/openline-p1.conf
d /opt/openline/empty-hooks            0555 root           root           -
d /var/lib/openline                    0755 root           root           -
d /var/lib/openline/projects           0711 root           root           -
d /var/lib/openline/projects/p1        0700 ol-recv-p1     ol-recv-p1     -
d /var/lib/openline/validation-spool   0750 ol-recv-p1     ol-valspool-p1 -
d /var/lib/openline/workers            0755 root           root           -
d /var/lib/openline/workers/alice      0700 ol-work-alice  ol-work-alice  -
d /var/lib/openline/workers/bob        0700 ol-work-bob    ol-work-bob    -
d /run/openline                        0755 root           root           -
d /run/openline/p1                     0711 ol-recv-p1     ol-recv-p1     -
