# OpenLine Production Isolation — systemd-sysusers configuration
# Install to: /etc/sysusers.d/openline-p1.conf
u ol-recv-p1     - "OpenLine Receiver Service (p1)"     /var/lib/openline/projects/p1 /usr/sbin/nologin
u ol-validate-p1 - "OpenLine Validator Service (p1)"    /var/lib/openline/validation-spool /usr/sbin/nologin
u ol-work-alice  - "OpenLine Untrusted Worker (alice)"  /var/lib/openline/workers/alice /usr/sbin/nologin
u ol-work-bob    - "OpenLine Untrusted Worker (bob)"    /var/lib/openline/workers/bob /usr/sbin/nologin
u ol-ctrl-p1     - "OpenLine Control Operator (p1)"     /var/lib/openline/control /usr/sbin/nologin

g ol-sock-p1      -
g ol-ctrl-sock-p1 -
g ol-valspool-p1  -

m ol-work-alice   ol-sock-p1
m ol-work-bob     ol-sock-p1
m ol-ctrl-p1      ol-ctrl-sock-p1
m ol-validate-p1  ol-valspool-p1
